# Single source of truth for every threshold, anchor and weight.
# Validated at startup by typed models (weather_risk/config.py).
# Rationale for each choice: docs/DECISIONS.md.

climatology:
  # Observed lens: the previous N completed calendar years, relative to today
  # (2021–2025 when run in 2026). Fetched on demand from Open-Meteo and cached.
  years: 5

coverage:
  # A hub's weather data counts as complete only if BOTH hold for the window being scored:
  # at least min_pct of the expected days have data, and no run of missing days is longer
  # than max_gap_days. Otherwise its weather-based scores are not computed and it is not
  # ranked — an incomplete record must not look as reliable as a complete one.
  min_pct: 99
  max_gap_days: 3

# ---------------------------------------------------------------------------
# Long-term Exposure Score (investment)
# ---------------------------------------------------------------------------
family_weights:          # overall = weighted mean of family scores; equal by default (D12)
  winter: 1
  hurricane: 1
  flood: 1
  severe_storm: 1
  heat: 1

lens_weights:            # default evidence weights; renormalized over the lenses a family has
  observed: 0.5          # Open-Meteo ERA5 days above an operational threshold
  modeled: 0.5           # FEMA NRI building-loss rate, national percentile
# Winter and heat override this (D20): they disrupt hubs through operations (closures,
# slow handling, labour safety), not building damage, so NRI's building-loss rate is a
# weak proxy there and observed weather frequency is the more direct evidence.

families:
  winter:
    label: Winter (snow, ice, extreme cold)
    lens_weights: {observed: 0.75, modeled: 0.25}
    # Days per year; `full_score_at` days/yr scores 100 (0 days scores 0).
    # Anchors are in reanalysis terms (D20): ERA5 smooths daily snowfall, so a 15 cm/day
    # indicator was ~0 at every hub; 10 cm/day is the strongest level the data shows.
    observed:
      - {id: snow_days,         label: "Days with snowfall ≥ 2.5 cm (1 in)", variable: snowfall_cm, op: ge, threshold: 2.5, full_score_at: 15}
      - {id: heavy_snow_days,   label: "Days with snowfall ≥ 10 cm (4 in)",  variable: snowfall_cm, op: ge, threshold: 10,  full_score_at: 1.5}
      - {id: extreme_cold_days, label: "Days with Tmin ≤ −18 °C (0 °F)",     variable: tmin_c,      op: le, threshold: -18, full_score_at: 15}
    modeled: {nri: [WNTW, ISTM, CWAV], combine: mean}
  hurricane:
    label: Hurricane / tropical storm
    observed: []         # reanalysis is not a hurricane record (HURDAT2 out of scope) → NRI only
    modeled: {nri: [HRCN], combine: mean}
  flood:
    label: Flood (inland, coastal, heavy rain)
    observed:
      - {id: heavy_rain_days, label: "Days with precipitation ≥ 50 mm (2 in)", variable: precip_mm, op: ge, threshold: 50, full_score_at: 4}
    modeled: {nri: [IFLD, CFLD], combine: max}
  severe_storm:
    label: Severe storm (tornado, hail, strong wind)
    observed: []         # reanalysis cannot resolve tornadoes or hail → NRI only
    modeled: {nri: [TRND, HAIL, SWND], combine: mean}
  heat:
    label: Extreme heat
    lens_weights: {observed: 0.75, modeled: 0.25}
    observed:
      - {id: hot_days, label: "Days with Tmax ≥ 35 °C (95 °F)", variable: tmax_c, op: ge, threshold: 35, full_score_at: 60}
    modeled: {nri: [HWAV], combine: mean}

nri_hazard_names:
  WNTW: Winter weather
  ISTM: Ice storm
  CWAV: Cold wave
  HRCN: Hurricane
  IFLD: Inland flooding
  CFLD: Coastal flooding
  TRND: Tornado
  HAIL: Hail
  SWND: Strong wind
  HWAV: Heat wave

robustness:
  perturbation: 0.25     # each weight moved ±25 %, one at a time
  tie_margin: 3.0        # score points; closer than this = effectively tied

# ---------------------------------------------------------------------------
# "% of days" statistics (D13)
# ---------------------------------------------------------------------------
stats:
  snowfall_days:
    short: "measurable snowfall (≥ 0.25 cm / 0.1 in)"
    label: Days with measurable snowfall (≥ 0.25 cm / 0.1 in)
    variable: snowfall_cm
    op: ge
    threshold: 0.25
    sensitivity:
      - {label: "Any snowfall (> 0 cm)",           op: gt, threshold: 0}
      - {label: "Measurable (≥ 0.25 cm / 0.1 in)", op: ge, threshold: 0.25}
      - {label: "≥ 2.5 cm (1 in)",                 op: ge, threshold: 2.5}
  heavy_snow_days:
    short: "heavy snowfall (≥ 10 cm / 4 in)"
    label: Days with heavy snowfall (≥ 10 cm / 4 in)
    variable: snowfall_cm
    op: ge
    threshold: 10
    sensitivity:
      - {label: "≥ 5 cm (2 in)",  op: ge, threshold: 5}
      - {label: "≥ 10 cm (4 in)", op: ge, threshold: 10}
      - {label: "≥ 15 cm (6 in)", op: ge, threshold: 15}
  freezing_days:
    short: "a minimum temperature at or below 0 °C (32 °F)"
    label: Days with minimum temperature ≤ 0 °C (32 °F)
    variable: tmin_c
    op: le
    threshold: 0
    sensitivity:
      - {label: "Tmin ≤ 0 °C",   op: le, threshold: 0}
      - {label: "Tmin ≤ −10 °C", op: le, threshold: -10}
      - {label: "Tmin ≤ −18 °C", op: le, threshold: -18}
  extreme_cold_days:
    short: "a minimum temperature at or below −18 °C (0 °F)"
    label: Days with minimum temperature ≤ −18 °C (0 °F)
    variable: tmin_c
    op: le
    threshold: -18
    sensitivity:
      - {label: "Tmin ≤ −10 °C", op: le, threshold: -10}
      - {label: "Tmin ≤ −18 °C", op: le, threshold: -18}
      - {label: "Tmin ≤ −25 °C", op: le, threshold: -25}
  rain_days:
    short: "at least 1 mm of precipitation"
    label: Days with precipitation ≥ 1 mm
    variable: precip_mm
    op: ge
    threshold: 1
    sensitivity:
      - {label: "> 0 mm",  op: gt, threshold: 0}
      - {label: "≥ 1 mm",  op: ge, threshold: 1}
      - {label: "≥ 10 mm", op: ge, threshold: 10}
  heavy_rain_days:
    short: "heavy rain (≥ 50 mm / 2 in)"
    label: Days with precipitation ≥ 50 mm (2 in)
    variable: precip_mm
    op: ge
    threshold: 50
    sensitivity:
      - {label: "≥ 25 mm",  op: ge, threshold: 25}
      - {label: "≥ 50 mm",  op: ge, threshold: 50}
      - {label: "≥ 100 mm", op: ge, threshold: 100}
  hot_days:
    short: "a maximum temperature at or above 35 °C (95 °F)"
    label: Days with maximum temperature ≥ 35 °C (95 °F)
    variable: tmax_c
    op: ge
    threshold: 35
    sensitivity:
      - {label: "Tmax ≥ 32 °C", op: ge, threshold: 32}
      - {label: "Tmax ≥ 35 °C", op: ge, threshold: 35}
      - {label: "Tmax ≥ 38 °C", op: ge, threshold: 38}
  windy_days:
    short: "gusts of 75 km/h (47 mph) or more"
    label: Days with gusts ≥ 75 km/h (47 mph)
    variable: gust_kmh
    op: ge
    threshold: 75
    sensitivity:
      - {label: "Gust ≥ 60 km/h", op: ge, threshold: 60}
      - {label: "Gust ≥ 75 km/h", op: ge, threshold: 75}
      - {label: "Gust ≥ 90 km/h", op: ge, threshold: 90}
